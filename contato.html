    <main class="corpo">
        <h1 class="formu">PREENCHA O FORMULÁRIO</h1>
        <p class="subititulo_formu">Para entrar em contato</P>

        <div class="area-inscrição">

            <form action="/processar cadastro" method="post" class="coluna-form"> 
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome" required minlength="3" maxlength="50"> <br>

                <label for="cpf">CPF</label>
                <input type="text" name="cpf" id="cpf" placeholder="Digite seu CPF" required minlength="11" maxlength="14"><br>

                <label for="e-mail">E-mail:</label>
                <input type="email" id="email" name="email"  placeholder="exemplo@dominio.com" required><br><br>

                <label for="data_nasc">Data de Nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimento" min="1900-01-01"  max="2026-12-31" required><br><br>

                <label >Qual o motivo do contato</label><br>

                <select name="motivo" id="motivo" required>
                    <option value=""disa select>Selecione o Motivo</option>
                    <option value="orcamento">Orçamento</option>
                    <option value="duvidas">Duvidas sobres pacotes</option>
                    <option value="parcelas">Parcelamentos</option>
                    <option value="outros">Outros</option>
                </select><br>

                <label for="outros">Outros</label>
                <input type="text" id="outros" name="outros" placeholder="Digite os motivos" required minlength="3" maxlength="50"> <br><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os Termos</label><br><br>

                <button type="submit" class="btn-enviar"> Enviar </button>
                <button type="reset" class="btn-limpar"> Limpar Tudo </button>

            </form>
